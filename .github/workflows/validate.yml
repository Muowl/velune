name: Validate Velune

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velune-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build, validate and package
        run: npm run package
      - name: Check generated theme is up to date
        run: git diff --exit-code -- themes/ core/resolved-tokens.json docs/validation.json docs/token-preview.html assets/icon.png assets/velune-icon.svg
      - name: Upload VSIX and validation results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: velune-${{ github.sha }}
          path: |
            dist/*.vsix
            dist/token-preview.html
            docs/validation.json
            assets/velune-mark.svg
            assets/velune-icon.svg
            dist/velune-icon-1024.png
            dist/velune-mark-1024.png
          if-no-files-found: error
          retention-days: 30
